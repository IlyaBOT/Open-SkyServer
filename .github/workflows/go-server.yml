name: Go server

on:
  push:
    branches: [repo-cleanup-go-server]
  pull_request:
    paths:
      - 'server/go/**'
      - 'server/native/**'
      - 'skypeopensource2/goodsendrelay4_dll/**'
      - 'skypeopensource2/skyauth4_dll/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Install compatibility toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 gcc-multilib libc6-dev-i386
      - name: Test Go server
        env:
          CGO_ENABLED: '1'
        run: go test ./...
      - name: Build amd64 server
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -o /tmp/openskyserver ./cmd/openskyserver
      - name: Build complete Debian bundle
        run: sh ./build-linux.sh
      - name: Smoke-test 0x42 worker
        run: |
          printf '\x41\x00' | ./bin/skype_blob_worker > /tmp/blob-worker.out
          printf '\x02\x00\x00\x00\x41\x00' > /tmp/blob-worker.expected
          cmp /tmp/blob-worker.expected /tmp/blob-worker.out
      - name: Inspect binaries
        run: |
          file ./bin/openskyserver
          file ./bin/skype_blob_worker
          test -x ./bin/openskyserver
          test -x ./bin/skype_blob_worker
